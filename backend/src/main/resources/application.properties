server.port=8080

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/skilllens_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:appa amma}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Initialization (Sample/Master Data Seed)
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT Security Configuration
skilllens.app.jwtSecret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
skilllens.app.jwtExpirationMs=86400000

# Logging
logging.level.com.skilllens=INFO
logging.level.org.springframework.security=WARN
